[project]
name = "jevtrader"
version = "0.1.0"
description = "Jev vs technical-analysis research engine"
authors = [
    { name = "Oliver Bennett", email = "ocben1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "polars>=2.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
jt = "jevtrader.cli:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
